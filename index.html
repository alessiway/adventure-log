<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure Log 💜</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="desktop">

    <div class="icons">

        <div class="icon" ondblclick="openFolder('recuerdos')">
            📁<br>
            Recuerdos
        </div>

        <div class="icon" ondblclick="openFolder('fotos')">
            🖼️<br>
            Fotos
        </div>

        <div class="icon locked">
            🔒<br>
            Secretos
        </div>

        <div class="icon" ondblclick="openFolder('aventura')">
            📖<br>
            Adventure Log
        </div>

    </div>


    <div class="taskbar">
        🪟 Inicio
    </div>


    <div id="window" class="window hidden">

        <div class="bar">
            Adventure Log 💜
        </div>

        <div class="inside" id="text">
            
        </div>

    </div>

</div>


<script>

function openFolder(folder){

let text="";

if(folder=="recuerdos"){
text="🌱 Aquí viven nuestros momentos más importantes...";
}

if(folder=="fotos"){
text="📸 Nuestra galería de recuerdos estará aquí.";
}

if(folder=="aventura"){
text="🗡️ Bienvenida a nuestra aventura, Nini. Este mundo fue creado para vos 💜";
}

document.getElementById("text").innerHTML=text;
document.getElementById("window").classList.remove("hidden");

}

</script>


</body>
</html>
