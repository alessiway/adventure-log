<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure Log 💜</title>
<link rel="stylesheet" href="style.css?v=2">
</head>

<body>

<div id="startScreen" class="start-screen">

    <div class="love-window">

        <div class="love-title">
            💜 Adventure_Log.exe
        </div>

        <div class="love-content">

            <h1>✨ Bienvenida, Nini ✨</h1>

            <p>
            Cargando recuerdos...
            </p>

            <p>
            Usuario encontrado:
            <br>
            <b>NICOLE 💜</b>
            </p>

            <button onclick="enterAdventure()">
                Iniciar aventura 🌸
            </button>

        </div>

    </div>

</div>
    
<div class="desktop">

    <div class="icons">

        <div class="icon" ondblclick="openFolder('recuerdos')">
            📁<br>
            Recuerdos
        </div>

        <div class="icon" ondblclick="openFolder('fotos')">
            🖼️<br>
            Fotos
        </div>

        <div class="icon locked">
            🔒<br>
            Secretos
        </div>

        <div class="icon" ondblclick="openFolder('aventura')">
            📖<br>
            Adventure Log
        </div>

    </div>


    <div class="taskbar">
        🪟 Inicio
    </div>


    <div id="window" class="window hidden">

        <div class="bar">
            Adventure Log 💜
        </div>

        <div class="inside" id="text">
            
        </div>

    </div>

</div>


<script>

function openFolder(folder){

let text="";

if(folder=="recuerdos"){
text="🌱 Aquí viven nuestros momentos más importantes...";
}

if(folder=="fotos"){
text="📸 Nuestra galería de recuerdos estará aquí.";
}

if(folder=="aventura"){
text=`
<h2>🗡️ Adventure Log</h2>

<p>
🌙 Capítulo 1: El comienzo de nuestra aventura
</p>

<p>
Todo comenzó con un pequeño mensaje...
</p>

<p>
"Holo"
</p>

<p>
Y una respuesta que inició algo hermoso:
</p>

<p>
"holi cmo estas :D"
</p>

<p>
Desde ese momento empezó nuestra historia 💜
</p>
`;
}

document.getElementById("text").innerHTML=text;
document.getElementById("window").classList.remove("hidden");

}
function enterAdventure(){

document.getElementById("startScreen").style.display="none";

}
</script>


</body>
</html>
